<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Housing delivery rate compared with the target rate</title>
<desc id="d">Fruitvale built 3.6 units a year from 2009 to 2019. A target of 291 units over 20 years needs about 14.5 units a year, about four times the built rate.</desc>
<style>
text{font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif;fill:#1F2A33}
.h{font-size:19px;font-weight:600}.l{font-size:14px}.s{font-size:12px;fill:#5B6770}.v{font-size:15px;font-weight:600}
</style>
<rect width="800" height="250" fill="#FFFFFF"/>
<text class="h" x="24" y="36">The target needs about four times the built rate</text>
<text class="l" x="24" y="92">Built, 2009 to 2019</text>
<text class="s" x="24" y="110">36 units over the period</text>
<rect x="290" y="76" width="90" height="36" fill="#8A969E"/>
<text class="v" x="390" y="100">3.6 a year</text>
<text class="l" x="24" y="152">Needed for the target</text>
<text class="s" x="24" y="170">291 units over 20 years</text>
<rect x="290" y="136" width="364" height="36" fill="#1E5E6E"/>
<text class="v" x="664" y="160">14.5 a year</text>
<g stroke="#C9D0D5" stroke-width="1">
<line x1="290" y1="186" x2="690" y2="186"/>
<line x1="290" y1="186" x2="290" y2="191"/><line x1="390" y1="186" x2="390" y2="191"/><line x1="490" y1="186" x2="490" y2="191"/><line x1="590" y1="186" x2="590" y2="191"/><line x1="690" y1="186" x2="690" y2="191"/>
</g>
<g class="s" text-anchor="middle"><text x="290" y="206">0</text><text x="390" y="206">4</text><text x="490" y="206">8</text><text x="590" y="206">12</text><text x="690" y="206">16</text></g>
<text class="s" x="24" y="236">Sources: RDKB Interim Housing Needs Report (Feb. 2025); Village of Fruitvale land disposition RFP (2024). Units a year.</text>
</svg>
