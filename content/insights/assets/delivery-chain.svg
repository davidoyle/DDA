<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The housing delivery chain</title>
<desc id="d">Nine conditions connect a housing target to occupied homes. In Fruitvale, local builders reported in 2020 that project economics failed at 300,000 to 320,000 dollars because of infrastructure costs and development charges.</desc>
<style>
text{font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif;fill:#1F2A33}
.h{font-size:19px;font-weight:600}.n{font-size:13px}.w{fill:#FFFFFF;font-weight:600}.s{font-size:12px;fill:#5B6770}.a{font-size:13px}
</style>
<rect width="980" height="330" fill="#FFFFFF"/>
<text class="h" x="18" y="36">Housing appears only when every link in the chain holds</text>
<text class="s" x="18" y="92">From the target</text>
<text class="s" x="962" y="92" text-anchor="end">to occupied homes</text>
<g stroke="#8A969E" stroke-width="2">
<line x1="114" y1="140" x2="124" y2="140"/><line x1="220" y1="140" x2="230" y2="140"/><line x1="326" y1="140" x2="336" y2="140"/><line x1="432" y1="140" x2="442" y2="140"/><line x1="538" y1="140" x2="548" y2="140"/><line x1="644" y1="140" x2="654" y2="140"/><line x1="750" y1="140" x2="760" y2="140"/><line x1="856" y1="140" x2="866" y2="140"/>
</g>
<g fill="#EEF1F3" stroke="#8A969E" stroke-width="1.5">
<rect x="18" y="108" width="96" height="64" rx="6"/><rect x="124" y="108" width="96" height="64" rx="6"/><rect x="230" y="108" width="96" height="64" rx="6"/><rect x="336" y="108" width="96" height="64" rx="6"/>
<rect x="548" y="108" width="96" height="64" rx="6"/><rect x="654" y="108" width="96" height="64" rx="6"/><rect x="760" y="108" width="96" height="64" rx="6"/><rect x="866" y="108" width="96" height="64" rx="6"/>
</g>
<rect x="442" y="108" width="96" height="64" rx="6" fill="#1E5E6E"/>
<g class="n" text-anchor="middle">
<text x="66" y="136">Households</text><text x="66" y="153">form</text>
<text x="172" y="136">Suitable</text><text x="172" y="153">land</text>
<text x="278" y="136">Policy</text><text x="278" y="153">permits form</text>
<text x="384" y="136">Servicing</text><text x="384" y="153">in place</text>
<text class="w" x="490" y="136">Project</text><text class="w" x="490" y="153">economics</text>
<text x="596" y="136">Finance</text><text x="596" y="153">available</text>
<text x="702" y="136">Builders</text><text x="702" y="153">able to build</text>
<text x="808" y="136">Approvals</text><text x="808" y="153">granted</text>
<text x="914" y="136">Units</text><text x="914" y="153">occupied</text>
</g>
<line x1="490" y1="172" x2="490" y2="198" stroke="#1E5E6E" stroke-width="1.5"/>
<g class="a" text-anchor="middle">
<text x="490" y="218">2020: local builders could not deliver new single-detached</text>
<text x="490" y="236">or duplex homes at $300,000 to $320,000. They named</text>
<text x="490" y="254">infrastructure costs and development charges as the barriers.</text>
</g>
<text class="s" x="18" y="312">Source: CitySpaces Consulting, Former Middle School background report for the Village of Fruitvale (Jan. 2020), p. 10.</text>
</svg>
